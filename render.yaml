# Hackathon starter: public React site + Fastify API + PostgreSQL.
# Does NOT deploy the sandboxed Muse Code executor or durable document uploads.
# Render Static Sites and free Web Services can sleep / have ephemeral storage.
services:
  - type: web
    name: orbit-demo-web
    runtime: static
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build -w @orbit/domain && npm run build -w @orbit/db && npm run build -w @orbit/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: orbit-demo-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build -w @orbit/domain && npm run build -w @orbit/db && npm run build -w @orbit/api
    startCommand: npm run db:migrate && npm run start -w @orbit/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-demo-db
          property: connectionString
      - key: ORBIT_AUTH_ISSUER
        value: orbit-render-demo
      - key: ORBIT_AUTH_SECRET
        generateValue: true
      - key: ORBIT_WEB_ORIGINS
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: ORBIT_OIDC_ISSUER
        value: https://accounts.google.com
      - key: ORBIT_OIDC_AUDIENCE
        sync: false
      - key: ORBIT_OIDC_JWKS_URL
        value: https://www.googleapis.com/oauth2/v3/certs

databases:
  - name: orbit-demo-db
    databaseName: orbit
    user: orbit
    region: frankfurt
    plan: free
