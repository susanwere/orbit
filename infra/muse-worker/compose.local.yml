# Local file-edit worker. Mount policy is generated by npm run muse:local.
services:
  muse-worker:
    image: orbit-muse-worker:local
    profiles: ["muse-smoke"]
    build:
      context: .
      dockerfile: infra/muse-worker/Dockerfile.local
    init: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit
      ORBIT_MUSE_ISOLATED_WORKER: "true"
      ORBIT_WORKER_POLICY: /run/orbit-policy.json
      ORBIT_WORKER_WORKSPACE: /workspace
      ORBIT_WORKER_BASE_BRANCH: main
      META_API_KEY: ${META_API_KEY:-}
      HOME: /tmp
    command: ["node", "--import", "tsx", "src/muse-queue-worker.ts", "execute"]
    volumes:
      - type: bind
        source: ${ORBIT_DISPOSABLE_CHECKOUT:?Set ORBIT_DISPOSABLE_CHECKOUT to an absolute disposable checkout path}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    working_dir: /orbit/apps/api
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
