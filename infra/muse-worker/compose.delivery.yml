# Separate trusted delivery container: no Muse credential. For disposable repos only.
services:
  muse-delivery:
    image: orbit-muse-worker:local
    profiles: ["muse-delivery"]
    build:
      context: .
      dockerfile: infra/muse-worker/Dockerfile.local
    init: true
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit
      ORBIT_MUSE_ISOLATED_WORKER: "true"
      ORBIT_WORKER_SANDBOX_CONFIRMED: "yes"
      ORBIT_WORKER_POLICY: /run/orbit-policy.json
      ORBIT_WORKER_WORKSPACE: /workspace
      ORBIT_WORKER_BASE_BRANCH: main
      ORBIT_WORKER_JOB_ID: ${ORBIT_WORKER_JOB_ID:-}
      ORBIT_WORKER_GITHUB_TOKEN: ${ORBIT_WORKER_GITHUB_TOKEN:-}
      HOME: /tmp
    command: ["node", "--import", "tsx", "src/muse-queue-worker.ts", "deliver"]
    volumes:
      - type: bind
        source: ${ORBIT_DISPOSABLE_CHECKOUT:?Set ORBIT_DISPOSABLE_CHECKOUT to an absolute disposable checkout path}
        target: /workspace
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${ORBIT_WORKER_POLICY_FILE:?Set the exact job policy path}
        target: /run/orbit-policy.json
        read_only: true
        bind:
          create_host_path: false
    working_dir: /orbit/apps/api
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
