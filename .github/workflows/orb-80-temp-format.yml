name: Temporary ORB-80 format
on:
  push:
    branches: [feat/orb-80-approved-plan-start-guard]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-80-approved-plan-start-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/agents/agent-session-service.ts apps/api/test/agent-session-service.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- apps/api/src/modules/agents/agent-session-service.ts apps/api/test/agent-session-service.test.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/api/src/modules/agents/agent-session-service.ts apps/api/test/agent-session-service.test.ts
            git commit -m 'style(ORB-80): format session-start guard'
            git push origin HEAD:feat/orb-80-approved-plan-start-guard
          fi
