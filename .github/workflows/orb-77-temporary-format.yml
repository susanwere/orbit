name: Temporary ORB-77 source formatting
on:
  push:
    branches:
      - feat/orb-77-contextual-inspector
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-77-contextual-inspector
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/WorkGraphCanvas.tsx
      - name: Push only formatting changes
        run: |
          if ! git diff --quiet -- apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/WorkGraphCanvas.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/WorkGraphCanvas.tsx
            git commit -m 'style(ORB-77): apply repository Prettier formatting'
            git push origin HEAD:feat/orb-77-contextual-inspector
          fi
