name: Temporary format canvas upload changes
on:
  push:
    branches: [feat/canvas-intent-document-uploads]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-intent-document-uploads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/planning/CanvasComposer.tsx apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/canvas-theme.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/planning/CanvasComposer.tsx apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/canvas-theme.css
          git diff --cached --quiet || (git commit -m "style: format canvas document upload UI" && git push)
