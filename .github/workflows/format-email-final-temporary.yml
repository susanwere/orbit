name: Format final email security changes (temporary)
on:
  push:
    branches: [feat/email-verification-password-reset]
    paths: [.github/workflows/format-email-final-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-verification-password-reset
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/auth/email-password-routes.ts apps/web/src/features/auth/google-sign-in.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/auth/email-password-routes.ts apps/web/src/features/auth/google-sign-in.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format email security fixes"
            git push origin HEAD:feat/email-verification-password-reset
          fi
