name: Temporary Prettier diagnostics
on:
  push:
    branches:
      - test/orb-80-postgres-step-concurrency
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Print formatted test source
        run: |
          echo ORBIT_FORMAT_BEGIN
          ./node_modules/.bin/prettier apps/api/test/workflow-step-concurrency.integration.test.ts
          echo ORBIT_FORMAT_END
