name: Capture Orbit Universe screenshot
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package-lock.json"
      - ".github/workflows/orbit-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project and browser tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start Orbit frontend
        run: |
          npm run dev:web > /tmp/orbit-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/orbit-vite.log
          exit 1
      - name: Capture Universe and the ORB-54 signed-out boundary
        run: |
          mkdir -p docs/images
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1, reducedMotion: 'reduce' });
            page.on('pageerror', err => console.error('BROWSER PAGE ERROR:', err.message));
            await page.goto('http://127.0.0.1:5173/', { waitUntil: 'domcontentloaded' });
            await page.getByRole('button', { name: 'View projects' }).click();
            await page.getByRole('heading', { name: 'Everything revolves around intent.' }).waitFor();
            await page.locator('.orbit-three-scene canvas').waitFor();
            const webgl = await page.locator('.orbit-three-scene canvas').evaluate(canvas => Boolean(canvas.getContext('webgl2') || canvas.getContext('webgl')));
            if (!webgl) throw new Error('WebGL is not available; screenshot would not represent the actual 3D scene');
            await page.waitForTimeout(2200);
            await page.screenshot({ path: 'docs/images/orbit-universe.png', fullPage: true, animations: 'disabled' });
            console.log('Captured Orbit Universe screenshot with WebGL enabled');

            // Preview the actual ORB-54 component in an isolated browser mount.
            // This does not simulate a real sign-in or modify production routes.
            await page.evaluate(async () => {
              const reactModule = await import('/node_modules/.vite/deps/react.js');
              const reactDomModule = await import('/node_modules/.vite/deps/react-dom_client.js');
              const React = reactModule.default ?? reactModule;
              const ReactDOM = reactDomModule.default ?? reactDomModule;
              const { AuthenticatedProjectApp } = await import('/src/features/auth/AuthenticatedProjectApp.tsx');
              const { createSessionStore } = await import('/src/features/auth/session-store.ts');
              document.getElementById('root').style.display = 'none';
              const screenshotRoot = document.createElement('div');
              screenshotRoot.id = 'auth-screenshot-root';
              document.body.prepend(screenshotRoot);
              ReactDOM.createRoot(screenshotRoot).render(
                React.createElement(AuthenticatedProjectApp, {
                  sessionStore: createSessionStore(),
                  apiBaseUrl: 'http://127.0.0.1:3000',
                }),
              );
            });
            await page.getByRole('heading', { name: 'Sign in required' }).waitFor();
            await page.screenshot({
              path: 'docs/images/orbit-auth-signed-out.png',
              fullPage: true,
              animations: 'disabled',
            });
            console.log('Captured actual ORB-54 signed-out UI component');
          } finally {
            await browser.close();
          }
          NODE
      - name: Start authentication-enabled frontend
        run: |
          VITE_GOOGLE_CLIENT_ID=ci-google-client VITE_API_BASE_URL=http://127.0.0.1:4000 npm run dev -w @orbit/web -- --port 5174 > /tmp/orbit-auth-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5174/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/orbit-auth-vite.log
          exit 1
      - name: Verify mocked browser authentication and project creation
        run: node scripts/auth-browser-smoke.mjs
      - name: Upload screenshot for PR reviewers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-pr-ui-screenshots
          path: |
            docs/images/orbit-universe.png
            docs/images/orbit-auth-signed-out.png
            docs/images/orbit-authenticated-project-creation.png
            /tmp/orbit-vite.log
          if-no-files-found: warn
