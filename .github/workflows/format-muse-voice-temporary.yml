name: Format Muse Voice (temporary)
on:
  push:
    branches: [feat/muse-voice-canvas-intent]
    paths: [.github/workflows/format-muse-voice-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/muse-voice-canvas-intent
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/voice/muse-voice-routes.ts apps/api/src/app.ts apps/api/src/server.ts apps/web/src/features/intent/intent-api.ts apps/web/src/features/planning/intent-voice-recorder.ts apps/web/src/features/planning/CanvasComposer.tsx apps/web/src/features/planning/PlanReview.tsx apps/api/test/muse-voice.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src apps/api/test apps/web/src
          if ! git diff --cached --quiet; then
            git commit -m "style: format Muse Voice integration"
            git push origin HEAD:feat/muse-voice-canvas-intent
          fi
