name: Format legacy source baseline

on:
  push:
    branches:
      - chore/enforce-readable-source

permissions:
  contents: write

jobs:
  format-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format all source files
        run: npm run format
      - name: Commit formatting-only baseline
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: normalize existing API, web, and package formatting"
          git push origin HEAD:chore/enforce-readable-source
