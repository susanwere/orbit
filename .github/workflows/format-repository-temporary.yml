name: Format repository architecture branch (temporary)
on:
  push:
    branches: [feat/repository-architecture-analysis]
    paths:
      - .github/workflows/format-repository-temporary.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repository-architecture-analysis
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier
        run: npx prettier --write apps/api/src/modules/context/repository-evidence.ts apps/api/src/modules/context/repository-evidence.test.ts apps/api/src/modules/context/project-knowledge-routes.ts apps/web/src/features/intent/intent-api.ts apps/web/src/features/planning/ProjectContextDocuments.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/context/repository-evidence.ts apps/api/src/modules/context/repository-evidence.test.ts apps/api/src/modules/context/project-knowledge-routes.ts apps/web/src/features/intent/intent-api.ts apps/web/src/features/planning/ProjectContextDocuments.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository-pinned Prettier"
            git push origin HEAD:feat/repository-architecture-analysis
          fi
