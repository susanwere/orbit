name: Format email auth test (temporary)
on:
  push:
    branches: [feat/email-password-auth]
    paths: [.github/workflows/format-email-test-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-password-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/auth/google-sign-in.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/auth/google-sign-in.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply pinned formatter to auth regression tests"
            git push origin HEAD:feat/email-password-auth
          fi
