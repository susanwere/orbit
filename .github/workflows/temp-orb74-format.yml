name: Temporary ORB74 formatter
on:
  push:
    branches: [feat/orb-72-local-demo-harness]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-72-local-demo-harness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/muse-open-jobs-demo.ts apps/api/src/muse-local-demo.ts apps/api/src/modules/execution/muse-open-jobs-contract.ts apps/api/src/modules/execution/simulated-engineering-executor.ts apps/api/test/muse-open-jobs-demo.test.ts apps/api/test/simulated-engineering-executor.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- apps/api; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/api
            git commit -m 'style(ORB-72): format local demo'
            git push origin HEAD:feat/orb-72-local-demo-harness
          fi
