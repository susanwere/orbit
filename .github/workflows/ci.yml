name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-25-plan-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Temporary branch formatting
        run: |
          npx prettier --write apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/plan-review.css apps/web/src/features/intent/IntentEntry.tsx apps/web/src/features/intent/intent-api.ts apps/web/src/features/intent/intent-api.test.ts scripts/auth-browser-smoke.mjs
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add apps/web/src/features/planning apps/web/src/features/intent/IntentEntry.tsx apps/web/src/features/intent/intent-api.ts apps/web/src/features/intent/intent-api.test.ts scripts/auth-browser-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(ORB-25): apply pinned formatter"
            git push origin HEAD:feat/orb-25-plan-review
          fi
      - name: Check source formatting
        run: npm run format:check
      - name: Build workspace dependencies
        run: npm run build -w @orbit/domain && npm run build -w @orbit/db
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      - name: Build
        run: npm run build
