name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting of changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          else
            base="$PUSH_BEFORE_SHA"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
            fi
          fi

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
              '*.json' '*.css' '*.scss' '*.md' '*.yml' '*.yaml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed format-supported files."
            exit 0
          fi

          npm exec -- prettier --check "${files[@]}"
      - name: Build workspace dependencies
        run: npm run build -w @orbit/domain && npm run build -w @orbit/db
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      - name: Build
        run: npm run build
