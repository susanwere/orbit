name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check changed-file formatting
        run: npm run format:changed
      - name: Build workspace dependencies
        run: npm run build -w @orbit/domain && npm run build -w @orbit/db
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      - name: Build
        run: npm run build

  format-baseline-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/enforce-readable-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format files without changing logic
        run: npm run format
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "Source already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply Prettier to existing source (no logic changes)"
          git push origin HEAD:chore/enforce-readable-source
