name: Temporary intent test formatting
on:
  push:
    branches: [feat/intent-multiple-document-attachments]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intent-multiple-document-attachments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/test/intent-document-attachments.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/intent-document-attachments.test.ts
          git diff --cached --quiet || (git commit -m "style: format intent attachment tests" && git push)
