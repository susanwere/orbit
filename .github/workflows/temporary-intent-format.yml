name: Temporary formatter
on:
  push:
    branches: [feat/intent-multiple-document-attachments]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intent-multiple-document-attachments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/intent/IntentEntry.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/intent/IntentEntry.tsx
          git diff --cached --quiet || (git commit -m "style: format attachment retry" && git push)
