name: Temporary nested UI formatting
on:
  push:
    branches: [feat/orbit-nested-workflows]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orbit-nested-workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/plan-review.css
      - name: Commit source formatting
        run: |
          if ! git diff --quiet -- apps/web/src/features/planning/; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/web/src/features/planning/
            git commit -m 'style: format nested workflow UI'
            git push origin HEAD:feat/orbit-nested-workflows
          fi
