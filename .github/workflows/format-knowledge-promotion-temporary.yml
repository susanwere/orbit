name: Format knowledge promotion (temporary)
on:
  push:
    branches: [feat/promote-approved-knowledge-context]
    paths: [.github/workflows/format-knowledge-promotion-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promote-approved-knowledge-context
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/context/promote-approved-knowledge.ts apps/api/src/modules/context/project-knowledge-routes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/context/promote-approved-knowledge.ts apps/api/src/modules/context/project-knowledge-routes.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format context promotion"
            git push origin HEAD:feat/promote-approved-knowledge-context
          fi
