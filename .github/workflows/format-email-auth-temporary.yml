name: Format email auth branch (temporary)
on:
  push:
    branches: [feat/email-password-auth]
    paths: [.github/workflows/format-email-auth-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-password-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/auth/email-password-routes.ts apps/api/src/modules/auth/auth-exchange-routes.ts apps/api/src/modules/auth/refresh-session-service.ts apps/api/src/app.ts apps/api/src/server.ts apps/web/src/features/auth/auth-api.ts apps/web/src/features/auth/google-sign-in.tsx apps/web/src/features/auth/AuthGateway.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src apps/web/src
          if ! git diff --cached --quiet; then
            git commit -m "style: format email authentication"
            git push origin HEAD:feat/email-password-auth
          fi
