name: Temporary formatter
on:
  push:
    branches: [feat/context-understanding-v1]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-understanding-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/context/project-knowledge-routes.ts apps/api/src/app.ts apps/api/src/server.ts apps/web/src/features/intent/intent-api.ts apps/web/src/features/planning/ProjectContextDocuments.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/context/project-knowledge-routes.ts apps/api/src/app.ts apps/api/src/server.ts apps/web/src/features/intent/intent-api.ts apps/web/src/features/planning/ProjectContextDocuments.tsx
          git diff --cached --quiet || (git commit -m "style: format context implementation" && git push)
