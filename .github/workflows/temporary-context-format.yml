name: Temporary context contract formatter
on:
  push:
    branches: [feat/project-context-document-library]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-context-document-library
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/intent/intent-api.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/intent/intent-api.ts
          git diff --cached --quiet || (git commit -m "style: format project context API" && git push)
