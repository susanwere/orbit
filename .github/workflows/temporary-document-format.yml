name: Temporary formatting for document PR
on:
  push:
    branches: [feat/intent-document-storage-foundation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intent-document-storage-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/app.ts apps/api/src/server.ts apps/api/src/modules/documents/project-document-routes.ts
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts apps/api/src/server.ts apps/api/src/modules/documents/project-document-routes.ts
          git diff --cached --quiet || (git commit -m "style: format document API files" && git push)
