name: Temporary ORB72 lease formatter
on:
  push:
    branches: [feat/orb-72-worker-lease-recovery]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-72-worker-lease-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/execution/muse-lease-recovery.ts apps/api/test/muse-lease-recovery.test.ts apps/api/src/modules/execution/muse-execution-worker.ts
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- apps/api/src/modules/execution/muse-lease-recovery.ts apps/api/test/muse-lease-recovery.test.ts apps/api/src/modules/execution/muse-execution-worker.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/api/src/modules/execution/muse-lease-recovery.ts apps/api/test/muse-lease-recovery.test.ts apps/api/src/modules/execution/muse-execution-worker.ts
            git commit -m 'style(ORB-72): format worker recovery'
            git push origin HEAD:feat/orb-72-worker-lease-recovery
          fi
