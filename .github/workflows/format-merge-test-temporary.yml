name: Format merged PR tests (temporary)
on:
  push:
    branches: [feat/github-merge-knowledge-refresh]
    paths: [.github/workflows/format-merge-test-temporary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-merge-knowledge-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/test/webhook-worker.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/webhook-worker.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format merged PR tests"
            git push origin HEAD:feat/github-merge-knowledge-refresh
          fi
