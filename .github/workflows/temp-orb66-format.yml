name: Temporary ORB66 format
on:
  push:
    branches: [fix/orb-80-work-item-session-identity]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orb-80-work-item-session-identity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/test/approved-step-materializer.test.ts apps/api/test/step-session-binding-service.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- apps/api/test/approved-step-materializer.test.ts apps/api/test/step-session-binding-service.test.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/api/test/approved-step-materializer.test.ts apps/api/test/step-session-binding-service.test.ts
            git commit -m 'style(ORB-80): format identity regression tests'
            git push origin HEAD:fix/orb-80-work-item-session-identity
          fi
