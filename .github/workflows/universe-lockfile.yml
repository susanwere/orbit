name: Refresh frontend 3D dependency lockfile

on:
  push:
    branches: [feat/orbit-universe-interactive-prototype]
    paths:
      - "apps/web/package.json"
      - ".github/workflows/universe-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize lockfile for Three.js dependencies"
            git push
          fi
