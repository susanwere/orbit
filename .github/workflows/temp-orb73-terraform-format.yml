name: Temporary ORB73 terraform formatter
on:
  push:
    branches: [feat/orb-72-aws-fargate-infrastructure]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-72-aws-fargate-infrastructure
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -recursive infra/muse-worker
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- infra/muse-worker; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add infra/muse-worker
            git commit -m 'style(ORB-72): terraform fmt'
            git push origin HEAD:feat/orb-72-aws-fargate-infrastructure
          fi
