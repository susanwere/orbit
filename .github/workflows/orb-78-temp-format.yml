name: Temporary ORB-78 formatter
on:
  push:
    branches: [feat/orb-78-fullwidth-workflow-pages]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orb-78-fullwidth-workflow-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/features/planning/PlanReview.tsx apps/web/src/features/planning/WorkGraphCanvas.tsx apps/web/src/features/planning/plan-review.css
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- apps/web/src/features/planning/; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/web/src/features/planning/
            git commit -m 'style(ORB-78): apply repository Prettier'
            git push origin HEAD:feat/orb-78-fullwidth-workflow-pages
          fi
